    <path d="M 180 29 Q 213 8 246 29" fill="none" stroke="#f6c21c" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="196" cy="45" r="15" fill="#121314"/><circle cx="196" cy="45" r="10.4" fill="#ffffff"/><circle cx="198.8" cy="45.8" r="6.2" fill="#121314"/><circle cx="200.8" cy="42.6" r="2.1" fill="#ffffff"/>
